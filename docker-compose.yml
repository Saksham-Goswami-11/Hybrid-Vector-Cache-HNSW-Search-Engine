version: '3.8'

services:
  nearby-db:
    build: 
      context: .
      dockerfile: Dockerfile
    image: nearby:latest
    container_name: nearby-db
    restart: unless-stopped
    ports:
      - "6399:6379"
    environment:
      - NEARBY_PASSWORD=${NEARBY_PASSWORD:-mysecret}
      - NEARBY_PORT=6379
      - NEARBY_AOF_PATH=/data/nearby.aof
    volumes:
      - nearby_data:/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  nearby_data:
