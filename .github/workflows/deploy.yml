name: Deploy to Azure VM

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 30
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            export GIT_TERMINAL_PROMPT=0

            if [ -d "$HOME/sypnase-cache" ]; then
              cd "$HOME/sypnase-cache"
            elif [ -d "$HOME/Hybrid-Vector-Cache-HNSW-Search-Engine" ]; then
              cd "$HOME/Hybrid-Vector-Cache-HNSW-Search-Engine"
            else
              echo "Project directory not found!"
              exit 1
            fi

            echo "Current directory: $(pwd)"
            echo "Fetching latest main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building and restarting Docker containers..."
            DOCKER_CMD=""
            if docker compose version &> /dev/null && docker info &> /dev/null; then
              DOCKER_CMD="docker compose"
            elif docker-compose version &> /dev/null && docker-compose ps &> /dev/null; then
              DOCKER_CMD="docker-compose"
            elif sudo -n docker compose version &> /dev/null; then
              DOCKER_CMD="sudo -n docker compose"
            elif sudo -n docker-compose version &> /dev/null; then
              DOCKER_CMD="sudo -n docker-compose"
            elif command -v docker-compose &> /dev/null; then
              DOCKER_CMD="docker-compose"
            else
              DOCKER_CMD="docker compose"
            fi

            echo "Using Docker command: $DOCKER_CMD"
            $DOCKER_CMD down || true
            $DOCKER_CMD up -d --build

            echo "Deployment successfully completed!"

