name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            if [ -d "$HOME/sypnase-cache" ]; then
              cd "$HOME/sypnase-cache"
            elif [ -d "$HOME/Hybrid-Vector-Cache-HNSW-Search-Engine" ]; then
              cd "$HOME/Hybrid-Vector-Cache-HNSW-Search-Engine"
            else
              echo "Project directory not found!"
              exit 1
            fi

            echo "Current directory: $(pwd)"
            echo "Fetching latest main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building and restarting Docker containers..."
            if command -v docker-compose &> /dev/null; then
              docker-compose down || true
              docker-compose up -d --build
            elif docker compose version &> /dev/null; then
              docker compose down || true
              docker compose up -d --build
            else
              sudo -n docker-compose down || true
              sudo -n docker-compose up -d --build
            fi

            echo "Deployment successfully completed!"
