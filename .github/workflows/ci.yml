name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Go Vet
      run: go vet ./cmd/... ./internal/... ./pkg/...

    - name: Build
      run: go build -v ./cmd/server ./pkg/client

    - name: Test (Race Detector)
      run: go test -race -short -timeout 5m -v ./internal/... ./pkg/...

    - name: Test (Fuzz Parser 10s)
      run: go test -fuzz=FuzzParse -fuzztime=10s ./internal/protocol/...

    - name: Test (Full Suite with Coverage)
      run: go test -coverprofile=coverage.out -timeout 5m -v ./internal/... ./pkg/...
